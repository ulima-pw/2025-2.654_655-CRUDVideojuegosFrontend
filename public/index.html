<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Gestión de Videojuegos</h1>
        <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#gameModal">
            Añadir Videojuego
        </button>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Plataformas</th>
                    <th>Fecha de Estreno</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dummy Data -->
                <tr>
                    <td>The Legend of Zelda: Breath of the Wild</td>
                    <td>Aventura</td>
                    <td>Nintendo Switch, Wii U</td>
                    <td>2017-03-03</td>
                    <td>Nuevo</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Eliminar</button>
                    </td>
                </tr>
                <tr>
                    <td>Red Dead Redemption 2</td>
                    <td>Acción-Aventura</td>
                    <td>PlayStation 4, Xbox One, PC</td>
                    <td>2018-10-26</td>
                    <td>Usado</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="gameModal" tabindex="-1" aria-labelledby="gameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="gameModalLabel">Añadir/Editar Videojuego</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" required>
                                <option selected disabled value="">Seleccione una categoría</option>
                                <option>Aventura</option>
                                <option>Acción-Aventura</option>
                                <option>RPG</option>
                                <option>Estrategia</option>
                                <option>Deportes</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="plataformas" class="form-label">Plataformas</label>
                            <select class="form-select" id="plataformas" multiple required>
                                <option>PC</option>
                                <option>PlayStation 4</option>
                                <option>PlayStation 5</option>
                                <option>Xbox One</option>
                                <option>Xbox Series X/S</option>
                                <option>Nintendo Switch</option>
                                <option>Wii U</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="fechaEstreno" class="form-label">Fecha de Estreno</label>
                            <input type="date" class="form-control" id="fechaEstreno" required>
                        </div>
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" required>
                                <option selected disabled value="">Seleccione un estado</option>
                                <option>Nuevo</option>
                                <option>Usado</option>
                                <option>Digital</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
